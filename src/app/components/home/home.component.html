<div class="min-h-screen bg-[#313338] flex items-center justify-center p-4">

		<h1 class="text-2xl font-bold text-white text-center mb-6">Fatigoon</h1>
		<div class="space-y-4">
			<input [(ngModel)]="username" (keyup.enter)="search()"

		</div>
	</div>
</div>
