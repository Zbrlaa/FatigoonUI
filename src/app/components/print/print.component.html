<div class="min-h-screen flex items-center justify-center bg-[#313338] text-white p-8">
  <div class="bg-[#2b2d31] p-8 rounded-lg shadow-lg w-full max-w-5xl">
    <h1 class="text-2xl font-bold mb-4 text-center">Programme TV</h1>
    <p class="text-sm text-[#b5bac1] mb-6 text-center">Diagramme de Gantt moderne pour un programme TV</p>

    <!-- Diagramme Gantt -->
    <div class="mb-6">
      <app-gantt-tv [shows]="shows()" [channels]="channels()"></app-gantt-tv>
    </div>

    <!-- Bouton Imprimer -->
    <div class="text-center">
      <button (click)="prepareForPrint()" class="py-3 px-6 bg-[#5865f2] hover:bg-[#4850d0] text-white rounded font-bold transition">
        Imprimer
      </button>
    </div>
  </div>
</div>
